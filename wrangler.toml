name = "idiom-app"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# nodejs_compat is required so @anthropic-ai/sdk can use Node.js built-ins (crypto, stream) inside the Workers V8 sandbox
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "idiom-app"
database_id = "9979992e-2593-458c-9994-a00284ba7535"
migrations_dir = "migrations"

[triggers]
crons = ["0 13 * * *"]

[observability]
enabled = true
head_sampling_rate = 1
