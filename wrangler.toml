name = "idiom-app"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# nodejs_compat is required so @anthropic-ai/sdk can use Node.js built-ins (crypto, stream) inside the Workers V8 sandbox
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "idiom-app"
database_id = "placeholder-replace-after-wrangler-d1-create"

[triggers]
crons = ["0 13 * * *"]
